<!-- ══════════════════════════════════════════════════════
     LOGIN PAGE (shown when not authenticated)
     ══════════════════════════════════════════════════════ -->
<div class="login-page" id="page-login">
  <div class="login-container anim-fade-up">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo anim-float">
          <i data-lucide="milk"></i>
        </div>
        <h1>Smart Dairy ERP</h1>
        <p>Sign in to your account to continue</p>
      </div>

      <form class="login-form" id="login-form">
        <div class="login-error" id="login-error"></div>

        <div class="form-group">
          <label class="form-label">Login As</label>
          <div class="login-role-tabs" id="login-role-tabs">
            <button type="button" class="role-tab active" data-role="SUPER_ADMIN">Super Admin</button>
            <button type="button" class="role-tab" data-role="BRANCH_MANAGER">Branch Manager</button>
            <button type="button" class="role-tab" data-role="FARMER">Farmer</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-branch">Branch</label>
          <div class="input-group">
            <span class="input-icon"><i data-lucide="building-2"></i></span>
            <select class="input-premium input-with-icon" id="login-branch" required>
              <option value="">Select Branch</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-username">Username</label>
          <div class="input-group">
            <span class="input-icon"><i data-lucide="user"></i></span>
            <input type="text" class="input-premium input-with-icon input-premium-lg" id="login-username" placeholder="Enter your username" autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-group">
            <span class="input-icon"><i data-lucide="lock"></i></span>
            <input type="password" class="input-premium input-with-icon input-premium-lg" id="login-password" placeholder="Enter your password" autocomplete="current-password" required>
            <span class="input-icon right" id="toggle-password"><i data-lucide="eye"></i></span>
          </div>
        </div>

        <div class="form-options">
          <label class="form-check">
            <input type="checkbox" id="remember-me">
            <span class="form-check-label">Remember me</span>
          </label>
          <a href="#" class="forgot-link" onclick="forgotPassword()">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">
          <i data-lucide="log-in"></i>
          Sign In
        </button>
      </form>

      <div class="login-dev-hint" title="Demo logins">
        <i data-lucide="info" style="width:14px;height:14px;"></i>
        <span>Head Office: <strong>admin</strong> / <strong>admin123</strong> · Branch: <strong>Branch Code</strong> / <strong>Branch Phone</strong></span>
      </div>

      <div class="login-divider"></div>

      <div class="login-footer">
        <div class="login-language">
          <button type="button" class="active" data-lang="en">English</button>
          <button type="button" data-lang="mr">\u092e\u0930\u093e\u0920\u0940</button>
          <button type="button" data-lang="hi">\u0939\u093f\u0928\u094d\u0926\u0940</button>
        </div>
        <p class="login-footer-text">&copy; 2026 Smart Dairy ERP. All rights reserved.</p>
      </div>
    </div>
  </div>
</div>
