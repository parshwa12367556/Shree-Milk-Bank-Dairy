<!-- ══════════════════════════════════════════════════════
     FORGOT PASSWORD MODAL (OTP flow)
     ══════════════════════════════════════════════════════ -->
<div class="modal" id="modal-forgot-password">
  <div class="modal-backdrop"></div>
  <div class="modal-content" style="max-width: 420px;">
    <div class="modal-header">
      <h5>Forgot Password</h5>
      <button class="modal-close" onclick="Modal.close('modal-forgot-password')">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="modal-body">
      <!-- Step 1: request OTP -->
      <div id="fp-step-1">
        <p class="modal-subtitle" style="font-size:var(--text-sm);color:var(--ink-secondary);margin-bottom:var(--space-4);">
          Enter your Login ID or registered email to receive a reset OTP.
        </p>
        <div class="form-group">
          <label class="form-label">Login ID / Email</label>
          <input type="text" class="input-premium" id="fp-identifier" placeholder="e.g. BR01OP001 or BR01001">
        </div>
        <div class="modal-form-error" id="fp-error1" style="display:none;color:var(--danger);font-size:var(--text-sm);margin-bottom:var(--space-3);"></div>
        <div class="modal-subtitle" id="fp-dev-otp" style="display:none;background:var(--accent-light);border:1px dashed var(--accent);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);color:var(--accent-dark);margin-bottom:var(--space-4);"></div>
      </div>
      <!-- Step 2: verify OTP + set new password -->
      <div id="fp-step-2" style="display:none;">
        <p class="modal-subtitle" style="font-size:var(--text-sm);color:var(--ink-secondary);margin-bottom:var(--space-4);">
          Enter the OTP sent to you, then choose a new password.
        </p>
        <div class="form-group">
          <label class="form-label">OTP</label>
          <input type="text" class="input-premium" id="fp-otp" placeholder="6-digit OTP" maxlength="6" inputmode="numeric">
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" class="input-premium" id="fp-new" placeholder="Minimum 8 characters with uppercase, lowercase & number" autocomplete="new-password">
        </div>
        <div class="modal-form-error" id="fp-error2" style="display:none;color:var(--danger);font-size:var(--text-sm);margin-bottom:var(--space-3);"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="fp-back" style="display:none;">Back</button>
      <button class="btn btn-primary" id="fp-submit" style="width:100%;">Send OTP</button>
    </div>
  </div>
</div>
