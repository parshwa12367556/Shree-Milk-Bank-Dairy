<!-- ══════════════════════════════════════════════════════
     CHANGE PASSWORD MODAL (forced after first login)
     ══════════════════════════════════════════════════════ -->
<div class="modal" id="modal-change-password" data-force>
  <div class="modal-backdrop"></div>
  <div class="modal-content" style="max-width: 420px;">
    <div class="modal-header">
      <h5>Set a New Password</h5>
    </div>
    <div class="modal-body">
      <p class="modal-subtitle" style="font-size:var(--text-sm);color:var(--ink-secondary);margin-bottom:var(--space-4);">
        For security, you must replace your default password before continuing.
      </p>
      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input type="password" class="input-premium" id="cp-current" placeholder="Your current password" autocomplete="current-password">
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" class="input-premium" id="cp-new" placeholder="Minimum 6 characters" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" class="input-premium" id="cp-confirm" placeholder="Repeat new password" autocomplete="new-password">
      </div>
      <div class="modal-form-error" id="cp-error" style="display:none;color:var(--danger);font-size:var(--text-sm);margin-bottom:var(--space-3);"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary w-full" id="cp-submit">
        <i data-lucide="shield-check" style="width:16px;height:16px;"></i>
        Update Password
      </button>
    </div>
  </div>
</div>
