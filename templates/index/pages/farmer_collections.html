      <!-- ── My Collections (farmer portal) ── -->
      <div class="page-container" id="page-farmer-collections" style="display:none;">
        <div class="breadcrumb">
          <a href="#farmer-dashboard"><i data-lucide="home" style="width:14px;height:14px;"></i></a>
          <span class="separator"><i data-lucide="chevron-right" style="width:12px;height:12px;"></i></span>
          <span class="current">My Collections</span>
        </div>

        <!-- Filters -->
        <div class="card" style="padding:var(--space-5);margin-bottom:var(--space-5);">
          <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
            <div class="form-group">
              <label class="form-label">From Date</label>
              <input type="date" class="input-premium" id="filter-from">
            </div>
            <div class="form-group">
              <label class="form-label">To Date</label>
              <input type="date" class="input-premium" id="filter-to">
            </div>
            <div class="form-group">
              <label class="form-label">Shift</label>
              <select class="input-premium" id="filter-shift">
                <option value="">All Shifts</option>
                <option value="MORNING">Morning</option>
                <option value="EVENING">Evening</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">&nbsp;</label>
              <button class="btn btn-primary w-full" onclick="window.refreshFarmerCollections && refreshFarmerCollections()">
                <i data-lucide="search" style="width:16px;height:16px;"></i> Apply
              </button>
            </div>
          </div>
        </div>

        <div class="table-wrapper">
          <div class="table-header">
            <div class="table-title">Collection Records</div>
            <div class="table-toolbar">
              <span class="table-info" id="collections-total" style="font-size:var(--text-xs);color:var(--ink-muted);">Loading…</span>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table-premium" id="fm-collections-table" style="width:100%;">
              <thead>
                <tr>
                  <th>Receipt</th>
                  <th>Date</th>
                  <th>Shift</th>
                  <th>Milk Type</th>
                  <th>Qty</th>
                  <th>Fat</th>
                  <th>SNF</th>
                  <th>Rate</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="collections-body">
                <tr><td colspan="10" class="text-center" style="padding:var(--space-4);color:var(--ink-muted);font-size:var(--text-sm);">Loading milk collections…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="table-footer">
            <div class="table-info" id="collections-pager-info">—</div>
            <div class="pagination-controls">
              <button class="btn btn-sm btn-ghost" id="collections-prev" onclick="window.pageFarmerCollections && pageFarmerCollections(-1)" disabled><i data-lucide="chevron-left" style="width:16px;height:16px;"></i> Prev</button>
              <button class="btn btn-sm btn-ghost" id="collections-next" onclick="window.pageFarmerCollections && pageFarmerCollections(1)" disabled>Next <i data-lucide="chevron-right" style="width:16px;height:16px;"></i></button>
            </div>
          </div>
        </div>

      </div>
