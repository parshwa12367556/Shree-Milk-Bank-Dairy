      <!-- ── Payment History (farmer portal) ── -->
      <div class="page-container" id="page-farmer-payments" style="display:none;">
        <div class="breadcrumb">
          <a href="#farmer-dashboard"><i data-lucide="home" style="width:14px;height:14px;"></i></a>
          <span class="separator"><i data-lucide="chevron-right" style="width:12px;height:12px;"></i></span>
          <span class="current">Payment History</span>
        </div>

        <!-- Summary -->
        <div class="kpi-grid">
          <div class="kpi-card kpi-teal" id="ph-paid-amount">
            <div class="kpi-icon"><i data-lucide="badge-check" style="width:20px;height:20px;"></i></div>
            <div class="kpi-label">Total Paid</div>
            <div class="kpi-value">—</div>
          </div>
          <div class="kpi-card kpi-amber" id="ph-pending-amount">
            <div class="kpi-icon"><i data-lucide="clock" style="width:20px;height:20px;"></i></div>
            <div class="kpi-label">Pending Amount</div>
            <div class="kpi-value">—</div>
          </div>
          <div class="kpi-card kpi-blue" id="ph-paid-count">
            <div class="kpi-icon"><i data-lucide="receipt" style="width:20px;height:20px;"></i></div>
            <div class="kpi-label">Payments Received</div>
            <div class="kpi-value">—</div>
          </div>
          <div class="kpi-card kpi-gold" id="ph-pending-count">
            <div class="kpi-icon"><i data-lucide="hourglass" style="width:20px;height:20px;"></i></div>
            <div class="kpi-label">Pending Payments</div>
            <div class="kpi-value">—</div>
          </div>
        </div>

        <div style="height:var(--space-5);"></div>

        <!-- Filters -->
        <div class="card" style="padding:var(--space-5);margin-bottom:var(--space-5);">
          <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
            <div class="form-group">
              <label class="form-label">Status</label>
              <select class="input-premium" id="filter-status">
                <option value="">All Status</option>
                <option value="PENDING">Pending</option>
                <option value="APPROVED">Approved</option>
                <option value="PAID">Paid</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">&nbsp;</label>
              <button class="btn btn-primary w-full" onclick="window.refreshFarmerPayments && refreshFarmerPayments()">
                <i data-lucide="search" style="width:16px;height:16px;"></i> Apply
              </button>
            </div>
          </div>
        </div>

        <div class="table-wrapper">
          <div class="table-header">
            <div class="table-title">Payments</div>
            <div class="table-toolbar">
              <span class="table-info" id="payments-total" style="font-size:var(--text-xs);color:var(--ink-muted);">Loading…</span>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table-premium" id="fm-payments-table" style="width:100%;">
              <thead>
                <tr>
                  <th>Pay Code</th>
                  <th>Period</th>
                  <th>Milk Qty</th>
                  <th>Collections</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Reference</th>
                  <th>Paid On</th>
                </tr>
              </thead>
              <tbody id="payments-body">
                <tr><td colspan="8" class="text-center" style="padding:var(--space-4);color:var(--ink-muted);font-size:var(--text-sm);">Loading payments…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="table-footer">
            <div class="table-info" id="payments-pager-info">—</div>
            <div class="pagination-controls">
              <button class="btn btn-sm btn-ghost" id="payments-prev" onclick="window.pageFarmerPayments && pageFarmerPayments(-1)" disabled><i data-lucide="chevron-left" style="width:16px;height:16px;"></i> Prev</button>
              <button class="btn btn-sm btn-ghost" id="payments-next" onclick="window.pageFarmerPayments && pageFarmerPayments(1)" disabled>Next <i data-lucide="chevron-right" style="width:16px;height:16px;"></i></button>
            </div>
          </div>
        </div>

      </div>
