      <!-- ── Vehicles Page ── -->
      <div class="page-container" id="page-vehicles" style="display:none;">
        <div class="breadcrumb">
          <a href="#dashboard">Dashboard</a>
          <span class="separator"><i data-lucide="chevron-right" style="width:12px;height:12px;"></i></span>
          <span class="current">Vehicles</span>
        </div>
        <div class="page-header">
          <div>
            <h2>Vehicles</h2>
            <p class="subtitle">Vehicle registry and maintenance</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="openVehicleModal()">
              <i data-lucide="plus" style="width:16px;height:16px;"></i>
              Add Vehicle
            </button>
          </div>
        </div>
        <div class="table-wrapper">
          <div class="table-responsive">
            <table class="table-premium" id="vehicles-table" style="width:100%;">
              <thead><tr><th>Number</th><th>Type</th><th>Driver</th><th>Capacity</th><th>Branch</th><th>Insurance</th><th>Next Service</th><th>GPS</th><th>Status</th><th style="width:120px;">Actions</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Vehicle Modal -->
        <div class="modal" id="vehicle-modal">
          <div class="modal-backdrop" onclick="closeVehicleModal()"></div>
          <div class="modal-content anim-scale-in">
            <div class="modal-header">
              <h5 id="vehicle-modal-title">Add Vehicle</h5>
              <button class="modal-close" onclick="closeVehicleModal()">&times;</button>
            </div>
            <div class="modal-body">
              <form id="vehicle-form">
                <input type="hidden" id="vehicle-id">
                <div class="form-group">
                  <label class="form-label">Vehicle Number <span class="required">*</span></label>
                  <input type="text" class="input-premium" id="vehicle-number" placeholder="e.g. MP-09-AB-1234" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Type <span class="required">*</span></label>
                  <select class="input-premium" id="vehicle-type" required>
                    <option value="">Select Type</option>
                    <option value="TANKER">Tanker</option>
                    <option value="PICKUP">Pickup</option>
                    <option value="MINI_VAN">Mini Van</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Driver Name</label>
                  <input type="text" class="input-premium" id="vehicle-driver" placeholder="Driver name">
                </div>
                <div class="form-group">
                  <label class="form-label">Capacity (Liters)</label>
                  <input type="number" class="input-premium" id="vehicle-capacity" placeholder="Capacity in liters" min="0">
                </div>
                <div class="form-group">
                  <label class="form-label">Branch</label>
                  <select class="input-premium" id="vehicle-branch">
                    <option value="">Select Branch</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Status</label>
                  <select class="input-premium" id="vehicle-status">
                    <option value="ACTIVE">Active</option>
                    <option value="MAINTENANCE">Maintenance</option>
                    <option value="INACTIVE">Inactive</option>
                  </select>
                </div>
                <div class="form-section"><h5 class="form-section-title"><span class="section-number">+</span> Insurance & Maintenance</h5></div>
                <div class="form-grid">
                  <div class="form-group">
                    <label class="form-label">Insurance Policy No.</label>
                    <input type="text" class="input-premium" id="vehicle-insurance-no" placeholder="POL-2026-XXXX">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Insurance Expiry</label>
                    <input type="date" class="input-premium" id="vehicle-insurance-expiry">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Last Service Date</label>
                    <input type="date" class="input-premium" id="vehicle-last-service">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Next Service Due</label>
                    <input type="date" class="input-premium" id="vehicle-next-service">
                  </div>
                  <div class="form-group">
                    <label class="form-label">GPS Status</label>
                    <select class="input-premium" id="vehicle-gps">
                      <option value="ACTIVE">Active Tracking</option>
                      <option value="NOT_TRACKED">Not Tracked</option>
                      <option value="OFFLINE">Offline</option>
                    </select>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="closeVehicleModal()">Cancel</button>
              <button class="btn btn-primary" onclick="saveVehicle()">
                <i data-lucide="save" style="width:16px;height:16px;"></i>
                Save Vehicle
              </button>
            </div>
          </div>
        </div>
      </div>
