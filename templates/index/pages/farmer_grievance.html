      <!-- ── Grievance (farmer portal) ── -->
      <div class="page-container" id="page-farmer-grievance" style="display:none;">
        <div class="breadcrumb">
          <a href="#farmer-dashboard"><i data-lucide="home" style="width:14px;height:14px;"></i></a>
          <span class="separator"><i data-lucide="chevron-right" style="width:12px;height:12px;"></i></span>
          <span class="current">Grievance</span>
        </div>

        <div class="dashboard-grid" style="grid-template-columns:1fr 1fr;">
          <div class="card">
            <div class="card-body">
              <form id="form-grievance">
                <div class="form-section">
                  <h5 class="form-section-title">
                    <span class="section-number">1</span>
                    New Grievance
                  </h5>
                  <div class="form-grid">
                    <div class="form-group">
                      <label class="form-label">Subject <span class="required">*</span></label>
                      <input type="text" class="input-premium" name="subject" placeholder="Brief subject" required>
                    </div>
                    <div class="form-group">
                      <label class="form-label">Category <span class="required">*</span></label>
                      <select class="input-premium" name="category" required>
                        <option value="">Select</option>
                        <option value="PAYMENT">Payment</option>
                        <option value="QUALITY">Quality</option>
                        <option value="COLLECTION">Collection</option>
                        <option value="OTHER">Other</option>
                      </select>
                    </div>
                    <div class="form-group" style="grid-column:span 2;">
                      <label class="form-label">Description <span class="required">*</span></label>
                      <textarea class="input-premium" name="description" placeholder="Describe your issue" rows="2" required></textarea>
                    </div>
                    <div class="form-group">
                      <label class="form-label">Related Receipt</label>
                      <input type="text" class="input-premium" name="receiptNo" placeholder="Optional receipt number">
                    </div>
                  </div>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn btn-primary btn-lg">
                    <i data-lucide="send" style="width:18px;height:18px;"></i>
                    Submit Grievance
                  </button>
                </div>
              </form>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h5 class="section-title">My Grievances</h5>
            </div>
            <div class="card-body" id="grievances-list" style="max-height:480px;overflow-y:auto;">
              <div style="text-align:center;padding:var(--space-8);">
                <div class="empty-icon" style="margin:0 auto var(--space-3);"><i data-lucide="inbox" style="width:36px;height:36px;"></i></div>
                <p style="color:var(--ink-muted);font-size:var(--text-sm);">Loading grievances…</p>
              </div>
            </div>
          </div>
        </div>

      </div>
