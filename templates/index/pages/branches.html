      <!-- ── Branches Page ── -->
      <div class="page-container" id="page-branches" style="display:none;">
        <div class="breadcrumb">
          <a href="#dashboard">Dashboard</a>
          <span class="separator"><i data-lucide="chevron-right" style="width:12px;height:12px;"></i></span>
          <span class="current">Branches</span>
        </div>
        <div class="page-header">
          <div>
            <h2>Branches</h2>
            <p class="subtitle">Manage all branches</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="openBranchModal()">
              <i data-lucide="plus" style="width:16px;height:16px;"></i>
              Add Branch
            </button>
          </div>
        </div>
        <div class="table-wrapper">
          <div class="table-responsive">
            <table class="table-premium" id="branches-table" style="width:100%;">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Branch Name</th>
                  <th>Manager</th>
                  <th>Phone</th>
                  <th>Address</th>
                  <th>Farmers</th>
                  <th>Collection</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Branch Modal -->
      <div class="modal" id="branch-modal">
        <div class="modal-backdrop" onclick="closeBranchModal()"></div>
        <div class="modal-content" style="max-width:560px;">
          <div class="modal-header">
            <h5 id="branch-modal-title">Add New Branch</h5>
            <button class="modal-close" onclick="closeBranchModal()"><i data-lucide="x"></i></button>
          </div>
          <form id="branch-form" onsubmit="saveBranch(event)">
            <div class="modal-body">
              <input type="hidden" id="branch-id">
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label">Branch Code <span class="required">*</span></label>
                  <input type="text" class="input-premium" id="branch-code" placeholder="e.g. BR06" required maxlength="20">
                </div>
                <div class="form-group">
                  <label class="form-label">Branch Name <span class="required">*</span></label>
                  <input type="text" class="input-premium" id="branch-name" placeholder="e.g. New Branch Name" required maxlength="200">
                </div>
                <div class="form-group">
                  <label class="form-label">Manager Name</label>
                  <input type="text" class="input-premium" id="branch-manager" placeholder="Manager name" maxlength="120">
                </div>
                <div class="form-group">
                  <label class="form-label">Phone <span class="required">*</span> <span style="font-weight:400;color:var(--ink-muted);font-size:var(--text-xs);">(branch login password)</span></label>
                  <input type="tel" class="input-premium" id="branch-phone" placeholder="Phone number = login password" maxlength="15" required>
                </div>
                <div class="form-group" style="grid-column:span 2;">
                  <label class="form-label">Address</label>
                  <textarea class="input-premium" id="branch-address" placeholder="Full address" rows="2"></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Village</label>
                  <input type="text" class="input-premium" id="branch-village" placeholder="Village" maxlength="100">
                </div>
                <div class="form-group">
                  <label class="form-label">District</label>
                  <input type="text" class="input-premium" id="branch-district" placeholder="District" maxlength="100">
                </div>
                <div class="form-group">
                  <label class="form-label">State</label>
                  <input type="text" class="input-premium" id="branch-state" placeholder="State" maxlength="100">
                </div>
                <div class="form-group">
                  <label class="form-label">Status</label>
                  <select class="input-premium" id="branch-status">
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" onclick="closeBranchModal()">Cancel</button>
              <button type="submit" class="btn btn-primary" id="branch-submit-btn">
                <i data-lucide="plus" style="width:16px;height:16px;"></i>
                Create Branch
              </button>
            </div>
          </form>
        </div>
      </div>
