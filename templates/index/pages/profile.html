      <!-- ── Profile Page ── -->
      <div class="page-container" id="page-profile" style="display:none;">
        <div class="breadcrumb">
          <a href="#dashboard">Dashboard</a>
          <span class="separator"><i data-lucide="chevron-right" style="width:12px;height:12px;"></i></span>
          <span class="current">My Profile</span>
        </div>
        <div class="page-header">
          <div>
            <h2>My Profile</h2>
            <p class="subtitle">Your account information</p>
          </div>
        </div>

        <div class="card" style="padding:var(--space-6);margin-bottom:var(--space-5);">
          <div style="display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;">
            <div class="profile-avatar" id="profile-avatar-text" style="width:80px;height:80px;font-size:1.75rem;">—</div>
            <div style="flex:1;min-width:220px;">
              <h3 id="profile-name">Loading…</h3>
              <p style="color:var(--ink-muted);font-size:var(--text-sm);" id="profile-username">—</p>
              <div class="profile-meta">
                <span id="profile-role-tag"><span class="tag tag-green">—</span></span>
                <span id="profile-branch" style="font-size:var(--text-sm);color:var(--ink-muted);">—</span>
                <span id="profile-last-login" style="font-size:var(--text-sm);color:var(--ink-muted);">—</span>
              </div>
            </div>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="card">
            <div class="card-header">
              <h5 class="section-title">Edit Profile</h5>
            </div>
            <div class="card-body">
              <form id="form-profile-update" class="form-grid">
                <div class="form-group">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="input-premium" id="pf-name" value="" maxlength="120">
                </div>
                <div class="form-group">
                  <label class="form-label">Email</label>
                  <input type="email" class="input-premium" id="pf-email" value="">
                </div>
                <div class="form-group">
                  <label class="form-label">Phone</label>
                  <input type="tel" class="input-premium" id="pf-phone" value="" maxlength="15">
                </div>
                <div class="form-group">
                  <label class="form-label">Username</label>
                  <input type="text" class="input-premium" id="pf-username" value="" disabled>
                </div>
                <div class="form-group" style="grid-column:1/-1;">
                  <button type="submit" class="btn btn-primary">
                    <i data-lucide="save" style="width:16px;height:16px;"></i> Update Profile
                  </button>
                </div>
              </form>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h5 class="section-title">Change Password</h5>
            </div>
            <div class="card-body">
              <form id="form-profile-password" class="form-grid">
                <div class="form-group">
                  <label class="form-label">Current Password</label>
                  <input type="password" class="input-premium" id="profile-current-pw" autocomplete="current-password">
                </div>
                <div class="form-group">
                  <label class="form-label">New Password</label>
                  <input type="password" class="input-premium" id="profile-new-pw" autocomplete="new-password">
                </div>
                <div class="form-group">
                  <label class="form-label">Confirm New Password</label>
                  <input type="password" class="input-premium" id="profile-confirm-pw" autocomplete="new-password">
                </div>
                <div class="form-group" style="grid-column:1/-1;">
                  <button type="submit" class="btn btn-secondary">
                    <i data-lucide="key-round" style="width:16px;height:16px;"></i> Change Password
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
