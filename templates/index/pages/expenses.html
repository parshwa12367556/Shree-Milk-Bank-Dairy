      <!-- ── Expenses Page ── -->
      <div class="page-container" id="page-expenses" style="display:none;">
        <div class="breadcrumb">
          <a href="#dashboard">Dashboard</a>
          <span class="separator"><i data-lucide="chevron-right" style="width:12px;height:12px;"></i></span>
          <span class="current">Expenses</span>
        </div>
        <div class="page-header">
          <div>
            <h2>Expenses</h2>
            <p class="subtitle">Operational expenses & profit/loss tracking</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="openExpenseModal()">
              <i data-lucide="plus" style="width:16px;height:16px;"></i>
              Add Expense
            </button>
          </div>
        </div>

        <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:var(--space-4);">
          <div class="kpi-card kpi-red" id="exp-kpi-total"><div class="kpi-value" style="font-size:var(--text-xl);">—</div><div class="kpi-label">Total Expenses</div></div>
          <div class="kpi-card kpi-blue" id="exp-kpi-count"><div class="kpi-value" style="font-size:var(--text-xl);">—</div><div class="kpi-label">Entries</div></div>
        </div>

        <div class="table-wrapper">
          <div class="table-header">
            <div class="table-title">Expense Records</div>
            <div class="table-toolbar">
              <select id="expense-category-filter" style="padding:var(--space-1) var(--space-6) var(--space-1) var(--space-2);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--ink);font-size:var(--text-sm);">
                <option value="">All Categories</option>
                <option value="FEED">Feed</option>
                <option value="LABOUR">Labour</option>
                <option value="TRANSPORT">Transport</option>
                <option value="MAINTENANCE">Maintenance</option>
                <option value="ELECTRICITY">Electricity</option>
                <option value="ADMIN">Admin</option>
                <option value="PROCUREMENT">Procurement</option>
                <option value="OTHER">Other</option>
              </select>
              <button class="btn btn-sm btn-ghost" title="Refresh" onclick="loadExpenses()"><i data-lucide="refresh-cw" style="width:16px;height:16px;"></i></button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table-premium" id="expenses-table" style="width:100%;">
              <thead><tr><th>Code</th><th>Date</th><th>Category</th><th>Description</th><th>Branch</th><th>Amount</th><th style="width:90px;">Actions</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Expense Modal -->
        <div class="modal" id="expense-modal">
          <div class="modal-backdrop" onclick="closeExpenseModal()"></div>
          <div class="modal-content anim-scale-in">
            <div class="modal-header"><h5 id="expense-modal-title">Add Expense</h5><button class="modal-close" onclick="closeExpenseModal()">&times;</button></div>
            <div class="modal-body">
              <form id="expense-form">
                <input type="hidden" id="expense-id">
                <div class="form-grid">
                  <div class="form-group"><label class="form-label">Category <span class="required">*</span></label><select class="input-premium" id="expense-category"><option value="FEED">Feed</option><option value="LABOUR">Labour</option><option value="TRANSPORT">Transport</option><option value="MAINTENANCE">Maintenance</option><option value="ELECTRICITY">Electricity</option><option value="ADMIN">Admin</option><option value="PROCUREMENT">Procurement</option><option value="OTHER">Other</option></select></div>
                  <div class="form-group"><label class="form-label">Amount (₹) <span class="required">*</span></label><input type="number" class="input-premium" id="expense-amount" min="0" step="0.01"></div>
                  <div class="form-group" style="grid-column:span 2;"><label class="form-label">Description</label><input type="text" class="input-premium" id="expense-description" placeholder="What was this expense for?"></div>
                  <div class="form-group"><label class="form-label">Date</label><input type="date" class="input-premium" id="expense-date"></div>
                  <div class="form-group"><label class="form-label">Branch</label><select class="input-premium" id="expense-branch"><option value="">Head Office</option></select></div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="closeExpenseModal()">Cancel</button>
              <button class="btn btn-primary" onclick="saveExpense()">Save Expense</button>
            </div>
          </div>
        </div>
      </div>
