      <!-- ── Farmers Page ── -->
      <div class="page-container" id="page-farmers" style="display:none;">
        <div class="breadcrumb">
          <a href="#dashboard">Dashboard</a>
          <span class="separator"><i data-lucide="chevron-right" style="width:12px;height:12px;"></i></span>
          <span class="current">Farmers</span>
        </div>
        <div class="page-header">
          <div>
            <h2>Farmers</h2>
            <p class="subtitle">Manage all registered farmers</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" data-action="register" data-role="ADMIN,BRANCH_OPERATOR" onclick="Router.navigate('farmer-form')">
              <i data-lucide="user-plus" style="width:16px;height:16px;"></i>
              Register Farmer
            </button>
          </div>
        </div>

        <!-- Stats -->
        <div class="farmer-stats-grid" id="farmer-stats"></div>

        <!-- Toolbar -->
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-mode-selector">
              <button class="mode-btn active">General</button>
              <button class="mode-btn">Code</button>
              <button class="mode-btn">Name</button>
              <button class="mode-btn">Phone</button>
            </div>
            <div class="search-bar" style="width:280px;">
              <span class="search-icon"><i data-lucide="search"></i></span>
              <input type="text" id="farmer-search-input" placeholder="Search by ID / name / mobile / Aadhaar...">
            </div>
          </div>
          <div class="toolbar-right">
            <select id="farmer-type-filter" style="padding:var(--space-1) var(--space-6) var(--space-1) var(--space-2);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--ink);font-size:var(--text-sm);">
              <option value="all">All Types</option>
              <option value="COW">Cow</option>
              <option value="BUFFALO">Buffalo</option>
              <option value="MIXED">Mixed</option>
            </select>
            <select id="farmer-status-filter" style="padding:var(--space-1) var(--space-6) var(--space-1) var(--space-2);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--ink);font-size:var(--text-sm);">
              <option value="all">All Status</option>
              <option value="ACTIVE">Active</option>
              <option value="PENDING_VERIFICATION">Pending Verification</option>
              <option value="INACTIVE">Inactive</option>
              <option value="BLOCKED">Blocked</option>
            </select>
            <button class="btn btn-sm btn-ghost" title="Export CSV" onclick="exportFarmersCSV()"><i data-lucide="download" style="width:16px;height:16px;"></i></button>
            <button class="btn btn-sm btn-ghost" title="Export CSV" onclick="Table.exportCSV('farmers-table', 'farmers.csv')"><i data-lucide="download" style="width:16px;height:16px;"></i></button>
            <button class="btn btn-sm btn-ghost" title="Print" onclick="Table.printTable('farmers-table')"><i data-lucide="printer" style="width:16px;height:16px;"></i></button>
            <button class="btn btn-sm btn-ghost" title="Refresh" onclick="loadFarmers()"><i data-lucide="refresh-cw" style="width:16px;height:16px;"></i></button>
          </div>
        </div>

        <!-- Bulk Action Bar -->
        <div class="bulk-action-bar" style="display:none;">
          <span class="bulk-count">0 selected</span>
          <button class="btn btn-sm btn-primary">SMS</button>
          <button class="btn btn-sm btn-secondary">Payment</button>
          <button class="btn btn-sm btn-danger">Delete</button>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
          <div class="table-responsive">
            <table class="table-premium" id="farmers-table" style="width:100%;">
              <thead>
                <tr>
                  <th class="checkbox-cell"><input type="checkbox"></th>
                  <th data-sortable="code">Code</th>
                  <th data-sortable="name">Farmer Name</th>
                  <th data-sortable="mobile">Mobile</th>
                  <th data-sortable="village">Village</th>
                  <th data-sortable="type">Type</th>
                  <th data-sortable="animals">Animals</th>
                  <th data-sortable="qty">Quantity</th>
                  <th data-sortable="amount">Amount</th>
                  <th data-sortable="status">Status</th>
                  <th data-sortable="joined">Joined</th>
                  <th style="width:120px;">Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="table-footer">
            <div class="table-info">Showing 1-10 of 1,247 farmers</div>
            <div class="pagination">
              <button class="page-btn prev-btn" disabled><i data-lucide="chevron-left" style="width:16px;height:16px;"></i></button>
              <button class="page-btn active">1</button>
              <button class="page-btn">2</button>
              <button class="page-btn">3</button>
              <span class="page-ellipsis">...</span>
              <button class="page-btn">125</button>
              <button class="page-btn next-btn"><i data-lucide="chevron-right" style="width:16px;height:16px;"></i></button>
            </div>
          </div>
        </div>
      </div>
