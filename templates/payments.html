<!-- Payments page - SPA fragment -->
<div class="page-container" id="page-payments" style="display:none;">
  <div class="breadcrumb"><a href="#dashboard">Dashboard</a><span class="separator"><i data-lucide="chevron-right" style="width:12px;height:12px;"></i></span><span class="current">Payments</span></div>
  <div class="page-header"><div><h2>Payments</h2><p class="subtitle">Manage farmer payments and payouts</p></div><div class="page-actions"><button class="btn btn-primary" id="generate-payment"><i data-lucide="wallet" style="width:16px;height:16px;"></i> Generate Payment Sheet</button></div></div>
  <div class="payment-summary"><div class="summary-card"><div class="summary-value" id="summary-total-paid">—</div><div class="summary-label">Total Paid (This Month)</div></div><div class="summary-card"><div class="summary-value" id="summary-pending" style="color:var(--warning-dark);">—</div><div class="summary-label">Pending Payouts</div></div><div class="summary-card"><div class="summary-value" id="summary-rate" style="color:var(--success);">—</div><div class="summary-label">Payment Rate</div></div></div>

    <div class="table-header"><div class="table-title">Payment Records</div><div class="table-toolbar"><select id="payment-status-filter" style="padding:var(--space-1) var(--space-6) var(--space-1) var(--space-2);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--ink);font-size:var(--text-sm);"><option value="">All Status</option><option value="PENDING">Pending</option><option value="APPROVED">Approved</option><option value="PAID">Paid</option></select></div></div>
    <div class="table-responsive"><table class="table-premium" id="payments-table" style="width:100%;"><thead><tr><th>Pay Code</th><th>Farmer</th><th>Period</th><th>Quantity</th><th>Amount</th><th>Collections</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>
