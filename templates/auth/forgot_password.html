{% extends 'base/auth_layout.html' %}
{% block page_title %}Forgot Password{% endblock %}
{% block auth_subtitle %}Enter your username or registered email to receive a reset OTP{% endblock %}

{% block auth_content %}
<div class="login-form" id="fp-form">
  <div class="login-error" id="login-error"></div>

  <div class="form-group">
    <label class="form-label" for="fp-identifier">Username / Email</label>
    <div class="input-group">
      <span class="input-icon"><i data-lucide="mail"></i></span>
      <input type="text" class="input-premium input-with-icon input-premium-lg" id="fp-identifier" placeholder="e.g. BR01 or admin@dairy.com" autocomplete="username" required>
    </div>
  </div>

  <div class="modal-subtitle" id="fp-dev-otp" style="display:none;background:var(--accent-light);border:1px dashed var(--accent);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);color:var(--accent-dark);margin-bottom:var(--space-4);"></div>

  <button type="button" class="btn-login" id="fp-submit">
    <i data-lucide="send"></i>
    Send OTP
  </button>

  <p style="text-align:center;margin-top:var(--space-4);font-size:var(--text-sm);color:var(--ink-muted);">
    Remembered it? <a href="/login" class="forgot-link">Back to Login</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/core/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const submit = document.getElementById('fp-submit');
  const errEl = document.getElementById('login-error');
  const showErr = (msg) => { errEl.textContent = msg; errEl.classList.add('visible'); };

  submit.addEventListener('click', async () => {
    const identifier = document.getElementById('fp-identifier').value.trim();
    if (!identifier) { showErr('Please enter your username or email'); return; }
    submit.disabled = true;
    submit.innerHTML = '<span class="anim-spin" style="display:inline-flex;width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;margin-right:8px;"></span> Sending...';
    try {
      const result = await API.forgotPassword(identifier);
      if (result.dev_otp) {
        const devOtp = document.getElementById('fp-dev-otp');
        devOtp.textContent = `Dev mode — your OTP is: ${result.dev_otp}`;
        devOtp.style.display = 'block';
      }
      window.location.href = '/verify-otp?u=' + encodeURIComponent(identifier);
    } catch (err) {
      showErr(err.message || 'Request failed');
      submit.disabled = false;
      submit.innerHTML = '<i data-lucide="send"></i> Send OTP';
    }
  });
});
</script>
{% endblock %}
