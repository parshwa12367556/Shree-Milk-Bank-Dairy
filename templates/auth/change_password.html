{% extends 'base/auth_layout.html' %}
{% block page_title %}Change Password{% endblock %}
{% block auth_subtitle %}For security, update your password to continue{% endblock %}

{% block auth_content %}
<div class="login-form" id="cp-form">
  <div class="login-error" id="login-error"></div>

  <div class="form-group">
    <label class="form-label" for="cp-current">Current Password</label>
    <div class="input-group">
      <span class="input-icon"><i data-lucide="lock"></i></span>
      <input type="password" class="input-premium input-with-icon input-premium-lg" id="cp-current" placeholder="Your current password" autocomplete="current-password" required>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="cp-new">New Password</label>
    <div class="input-group">
      <span class="input-icon"><i data-lucide="lock"></i></span>
      <input type="password" class="input-premium input-with-icon input-premium-lg" id="cp-new" placeholder="Min 8 chars: uppercase, lowercase & number" autocomplete="new-password" required>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="cp-confirm">Confirm New Password</label>
    <div class="input-group">
      <span class="input-icon"><i data-lucide="lock"></i></span>
      <input type="password" class="input-premium input-with-icon input-premium-lg" id="cp-confirm" placeholder="Repeat new password" autocomplete="new-password" required>
    </div>
  </div>

  <button type="button" class="btn-login" id="cp-submit">
    <i data-lucide="shield-check"></i>
    Update Password
  </button>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const submit = document.getElementById('cp-submit');
  const errEl = document.getElementById('login-error');
  const showErr = (msg) => { errEl.textContent = msg; errEl.classList.add('visible'); };

  submit.addEventListener('click', async () => {
    const current = document.getElementById('cp-current').value.trim();
    const next = document.getElementById('cp-new').value.trim();
    const confirm = document.getElementById('cp-confirm').value.trim();
    if (!current || !next) { showErr('Current and new passwords are required'); return; }
    const policyError = window.Auth ? Auth.passwordPolicyError(next) : null;
    if (policyError) { showErr(policyError); return; }
    if (next !== confirm) { showErr('Passwords do not match'); return; }
    submit.disabled = true;
    submit.innerHTML = '<span class="anim-spin" style="display:inline-flex;width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;margin-right:8px;"></span> Updating...';
    try {
      await API.changePassword(current, next);
      window.location.href = '/login?changed=1';
    } catch (err) {
      showErr(err.message || 'Failed to update password');
      submit.disabled = false;
      submit.innerHTML = '<i data-lucide="shield-check"></i> Update Password';
    }
  });
});
</script>
{% endblock %}
