{% extends 'base/auth_layout.html' %}
{% block page_title %}Reset Password{% endblock %}
{% block auth_subtitle %}Choose a new password for your account{% endblock %}

{% block auth_content %}
<div class="login-form" id="reset-form">
  <div class="login-error" id="login-error"></div>

  <div class="form-group">
    <label class="form-label" for="rp-new">New Password</label>
    <div class="input-group">
      <span class="input-icon"><i data-lucide="lock"></i></span>
      <input type="password" class="input-premium input-with-icon input-premium-lg" id="rp-new" placeholder="Minimum 6 characters" autocomplete="new-password" required>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="rp-confirm">Confirm New Password</label>
    <div class="input-group">
      <span class="input-icon"><i data-lucide="lock"></i></span>
      <input type="password" class="input-premium input-with-icon input-premium-lg" id="rp-confirm" placeholder="Repeat new password" autocomplete="new-password" required>
    </div>
  </div>

  <button type="button" class="btn-login" id="rp-submit">
    <i data-lucide="shield-check"></i>
    Reset Password
  </button>

  <p style="text-align:center;margin-top:var(--space-4);font-size:var(--text-sm);color:var(--ink-muted);">
    <a href="/login" class="forgot-link">Back to Login</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const identifier = params.get('u') || '';
  const otp = params.get('otp') || '';
  const submit = document.getElementById('rp-submit');
  const errEl = document.getElementById('login-error');
  const showErr = (msg) => { errEl.textContent = msg; errEl.classList.add('visible'); };

  submit.addEventListener('click', async () => {
    const next = document.getElementById('rp-new').value.trim();
    const confirm = document.getElementById('rp-confirm').value.trim();
    if (!identifier) { showErr('Session expired. Please request a new OTP.'); return; }
    if (!otp) { showErr('OTP is missing. Please restart the process.'); return; }
    if (!next || next.length < 6) { showErr('New password must be at least 6 characters'); return; }
    if (next !== confirm) { showErr('Passwords do not match'); return; }
    submit.disabled = true;
    submit.innerHTML = '<span class="anim-spin" style="display:inline-flex;width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;margin-right:8px;"></span> Resetting...';
    try {
      await API.resetPassword(identifier, otp, next);
      window.location.href = '/login?reset=1';
    } catch (err) {
      showErr(err.message || 'Reset failed');
      submit.disabled = false;
      submit.innerHTML = '<i data-lucide="shield-check"></i> Reset Password';
    }
  });
});
</script>
{% endblock %}
