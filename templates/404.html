<!-- 404 error page - rendered as page container within index.html SPA shell -->
<div class="page-container" id="page-404" style="display:none;">
  <div class="empty-state" style="padding:var(--space-16) var(--space-6);">
    <div class="empty-icon" style="font-size:6rem;color:var(--gray-400);">
      <i data-lucide="file-question" style="width:96px;height:96px;"></i>
    </div>
    <h2 style="font-family:var(--font-display);font-size:var(--text-4xl);margin-bottom:var(--space-2);">404</h2>
    <h3 style="font-size:var(--text-xl);margin-bottom:var(--space-3);">Page Not Found</h3>
    <p style="max-width:500px;margin:0 auto var(--space-6);">The page you're looking for doesn't exist or has been moved.</p>
    <button class="btn btn-primary btn-lg" onclick="Router.navigate('dashboard')">
      <i data-lucide="arrow-left" style="width:18px;height:18px;"></i>
      Back to Dashboard
    </button>
  </div>
</div>
