{% extends 'base/auth_layout.html' %}
{% block page_title %}Login{% endblock %}

{% block auth_content %}
<form class="login-form" id="login-form" novalidate>
  <div class="login-error" id="login-error"></div>

  <div class="form-group">
    <label class="form-label" for="login-username">Login ID</label>
    <div class="input-group">
      <span class="input-icon"><i data-lucide="user"></i></span>
      <input type="text" class="input-premium input-with-icon input-premium-lg"
             id="login-username" placeholder="Enter your Login ID"
             autocomplete="username" autocapitalize="characters" required>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="login-password">Password</label>
    <div class="input-group">
      <span class="input-icon"><i data-lucide="lock"></i></span>
      <input type="password" class="input-premium input-with-icon input-premium-lg"
             id="login-password" placeholder="Enter your Password"
             autocomplete="current-password" required>
      <span class="input-icon right" id="toggle-password"><i data-lucide="eye"></i></span>
    </div>
  </div>

  <div class="form-options">
    <label class="form-check">
      <input type="checkbox" id="remember-me">
      <span class="form-check-label">Remember Me</span>
    </label>
    <a href="/forgot-password" class="forgot-link">Forgot Password?</a>
  </div>

  <button type="submit" class="btn-login" id="login-submit">
    <i data-lucide="log-in"></i>
    Sign In
  </button>

  <p class="login-secure-note" style="text-align:center;font-size:var(--text-xs);color:var(--ink-muted);margin-top:var(--space-5);">
    <i data-lucide="shield-check" style="width:14px;height:14px;"></i>
    Secure access to Shree Milk Bank Dairy
  </p>
</form>

{% endblock %}

{% block scripts %}
<script>
/** Common login — Login ID + password; the backend detects the role. */
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('login-form');
  if (!form) return;
  const submitBtn = form.querySelector('.btn-login');
  const errorDiv = document.querySelector('.login-error');
  const showErr = (msg) => { errorDiv.textContent = msg; errorDiv.classList.add('visible'); setTimeout(() => errorDiv.classList.remove('visible'), 5000); };

  // Password visibility toggle
  const toggleBtn = document.getElementById('toggle-password');
  const pwInput = document.getElementById('login-password');
  if (toggleBtn && pwInput) {
    toggleBtn.addEventListener('click', () => {
      const type = pwInput.type === 'password' ? 'text' : 'password';
      pwInput.type = type;
      toggleBtn.innerHTML = type === 'password' ? '<i data-lucide="eye"></i>' : '<i data-lucide="eye-off"></i>';
      if (window.lucide) lucide.createIcons();
    });
  }

  // Remember Me — remembers the Login ID only (never the password)
  const rememberMe = document.getElementById('remember-me');
  if (rememberMe) {
    const saved = localStorage.getItem('sd_remember_login');
    if (saved) { document.getElementById('login-username').value = saved; rememberMe.checked = true; }
    rememberMe.addEventListener('change', () => {
      const loginId = document.getElementById('login-username').value;
      if (rememberMe.checked && loginId) localStorage.setItem('sd_remember_login', loginId);
      else localStorage.removeItem('sd_remember_login');
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const loginId = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!loginId || !password) { showErr('Please enter your Login ID and password'); return; }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="anim-spin" style="display:inline-flex;width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;margin-right:8px;"></span> Signing in...';
    try {
      const result = await API.login(loginId, password, rememberMe ? rememberMe.checked : false);
      Storage.setToken(result.token);
      const user = result.user || {};
      user.mustChangePassword = !!result.mustChangePassword;
      Storage.setUser(user);
      if (user.mustChangePassword) { window.location.href = '/change-password'; return; }
      const roleMap = { 'ADMIN': '/admin/dashboard', 'BRANCH_OPERATOR': '/branch/dashboard', 'FARMER': '/farmer/dashboard' };
      window.location.href = roleMap[user.role] || '/admin/dashboard';
    } catch (err) {
      showErr(err.message || 'Invalid Login ID or Password');
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i data-lucide="log-in"></i> Sign In';
      if (window.lucide) lucide.createIcons();
    }
  });
});
</script>
{% endblock %}
