{% macro page_header(title, subtitle='', actions='') -%}
<div class="page-header">
  <div>
    <h2>{{ title }}</h2>
    {% if subtitle %}<p class="subtitle">{{ subtitle }}</p>{% endif %}
  </div>
  {% if actions %}<div class="page-actions">{{ actions | safe }}</div>{% endif %}
</div>
{%- endmacro %}
