<!-- Farmer Registration Form - SPA fragment -->
<div class="page-container" id="page-farmer-form" style="display:none;">
  <div class="breadcrumb"><a href="#dashboard">Dashboard</a><span class="separator"><i data-lucide="chevron-right" style="width:12px;height:12px;"></i></span><a href="#farmers">Farmers</a><span class="separator"><i data-lucide="chevron-right" style="width:12px;height:12px;"></i></span><span class="current">Register Farmer</span></div>
  <div class="page-header">
    <div><h2>Register New Farmer</h2><p class="subtitle">Add a new farmer to the system</p></div>
    <div class="page-actions"><button class="btn btn-secondary" onclick="Router.navigate('farmers')"><i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Back to List</button></div>
  </div>
  <div class="card">
    <div class="card-body">
      <form id="farmer-form">
        <div class="form-section"><h5 class="form-section-title"><span class="section-number">1</span> Personal Information</h5><div class="form-grid">
          <div class="form-group"><label class="form-label">Farmer Name <span class="required">*</span></label><input type="text" class="input-premium" name="farmer_name" placeholder="Enter full name"><div class="form-error"></div></div>
          <div class="form-group"><label class="form-label">Father's Name <span class="required">*</span></label><input type="text" class="input-premium" name="father_name" placeholder="Enter father's name"><div class="form-error"></div></div>
          <div class="form-group"><label class="form-label">Mobile Number <span class="required">*</span></label><input type="tel" class="input-premium" name="mobile" placeholder="10-digit mobile number" maxlength="10"><div class="form-error"></div></div>
          <div class="form-group"><label class="form-label">Alternate Mobile</label><input type="tel" class="input-premium" name="alt_mobile" placeholder="Alternate mobile" maxlength="10"></div>
          <div class="form-group"><label class="form-label">Email</label><input type="email" class="input-premium" name="email" placeholder="email@example.com"></div>
          <div class="form-group"><label class="form-label">Aadhaar <span class="required">*</span></label><input type="text" class="input-premium" name="aadhaar" placeholder="12-digit Aadhaar" maxlength="12"><div class="form-error"></div></div>
          <div class="form-group"><label class="form-label">PAN Number</label><input type="text" class="input-premium" name="pan" placeholder="PAN number" maxlength="10"></div>
          <div class="form-group"><label class="form-label">Date of Birth</label><input type="date" class="input-premium" name="date_of_birth"></div>
        </div></div>
        <div class="form-section"><h5 class="form-section-title"><span class="section-number">2</span> Address Details</h5><div class="form-grid">
          <div class="form-group" style="grid-column:span 2;"><label class="form-label">Address</label><textarea class="input-premium" name="address" placeholder="Full address" rows="2"></textarea></div>
          <div class="form-group"><label class="form-label">Village <span class="required">*</span></label><input type="text" class="input-premium" name="village" placeholder="Village name"><div class="form-error"></div></div>
          <div class="form-group"><label class="form-label">Taluka</label><input type="text" class="input-premium" name="taluka" placeholder="Taluka"></div>
          <div class="form-group"><label class="form-label">District</label><input type="text" class="input-premium" name="district" placeholder="District"></div>
          <div class="form-group"><label class="form-label">State</label><input type="text" class="input-premium" name="state" placeholder="State"></div>
          <div class="form-group"><label class="form-label">Pincode</label><input type="text" class="input-premium" name="pincode" placeholder="Pincode" maxlength="6"></div>
          <div class="form-group"><label class="form-label">Landmark</label><input type="text" class="input-premium" name="landmark" placeholder="Nearby landmark"></div>
        </div></div>
        <div class="form-section"><h5 class="form-section-title"><span class="section-number">3</span> Livestock Information</h5><div class="form-grid">
          <div class="form-group"><label class="form-label">Milk Type <span class="required">*</span></label><select class="input-premium" name="milk_type"><option value="">Select Type</option><option value="COW">Cow Milk</option><option value="BUFFALO">Buffalo Milk</option><option value="MIXED">Mixed Milk</option></select><div class="form-error"></div></div>
          <div class="form-group"><label class="form-label">Number of Cows</label><input type="number" class="input-premium" name="cow_count" placeholder="0" min="0"></div>
          <div class="form-group"><label class="form-label">Number of Buffaloes</label><input type="number" class="input-premium" name="buffalo_count" placeholder="0" min="0"></div>
          <div class="form-group"><label class="form-label">Breed</label><input type="text" class="input-premium" name="breed" placeholder="Breed"></div>
          <div class="form-group"><label class="form-label">Preferred Shift</label><select class="input-premium" name="preferred_shift"><option value="">Any</option><option value="MORNING">Morning</option><option value="EVENING">Evening</option></select></div>
        </div></div>
        <div class="form-section"><h5 class="form-section-title"><span class="section-number">4</span> Bank Details</h5><div class="form-grid">
          <div class="form-group"><label class="form-label">Account Holder</label><input type="text" class="input-premium" name="account_holder" placeholder="As per bank records"></div>
          <div class="form-group"><label class="form-label">Bank Name</label><input type="text" class="input-premium" name="bank_name" placeholder="Bank name"></div>
          <div class="form-group"><label class="form-label">Account Number</label><input type="text" class="input-premium" name="account_number" placeholder="Account number"><div class="form-error"></div></div>
          <div class="form-group"><label class="form-label">IFSC Code</label><input type="text" class="input-premium" name="ifsc" placeholder="IFSC code" maxlength="11"><div class="form-error"></div></div>
          <div class="form-group"><label class="form-label">UPI ID</label><input type="text" class="input-premium" name="upi" placeholder="upi@bank"></div>
        </div></div>
        <div class="form-section"><h5 class="form-section-title"><span class="section-number">5</span> Assignment</h5><div class="form-grid">
          <div class="form-group"><label class="form-label">Branch</label><select class="input-premium" name="branch_id"><option value="">Select Branch</option><option value="1">Agar Malwa Main</option><option value="2">Susner Sub</option></select></div>
          <div class="form-group"><label class="form-label">QR Code</label><div class="flex items-center gap-2"><input type="text" class="input-premium" name="qr_code" placeholder="Auto-generated" readonly><button type="button" class="btn btn-secondary" onclick='generateFarmerQR()'><i data-lucide="qr-code" style="width:16px;height:16px;"></i> Generate</button></div></div>
        </div></div>
        <div class="form-section"><h5 class="form-section-title"><span class="section-number">6</span> Notification Preferences</h5><div class="flex gap-4"><label class="form-check"><input type="checkbox" name="notification_sms" checked><span class="form-check-label">SMS</span></label><label class="form-check"><input type="checkbox" name="notification_whatsapp"><span class="form-check-label">WhatsApp</span></label><label class="form-check"><input type="checkbox" name="notification_email"><span class="form-check-label">Email</span></label></div></div>
        <div class="form-actions"><button type="button" class="btn btn-secondary" onclick="Router.navigate('farmers')">Cancel</button><button type="submit" class="btn btn-primary btn-lg"><i data-lucide="user-plus" style="width:18px;height:18px;"></i> Register Farmer</button></div>
      </form>
    </div>
  </div>
</div>
