<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance · Shree Milk Bank</title>
  <link rel="icon" href="/static/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/login.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
  <style>
    .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .error-card { max-width: 520px; text-align: center; }
    .error-icon { width: 88px; height: 88px; border-radius: var(--radius-full);
      background: var(--accent-light); color: var(--accent-dark);
      display: inline-flex; align-items: center; justify-content: center; margin-bottom: var(--space-4); animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .status-pill { display: inline-flex; align-items: center; gap: var(--space-2);
      background: var(--warning-light); color: var(--warning-dark);
      border: 1px solid var(--warning); border-radius: var(--radius-full);
      padding: var(--space-1) var(--space-3); font-size: var(--text-xs); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-4); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning-dark); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .error-actions { display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap; margin-top: var(--space-6); }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="login-card error-card" style="padding:var(--space-8);">
      <div class="status-pill"><span class="status-dot"></span> Under Maintenance</div>
      <div class="error-icon"><i data-lucide="wrench" style="width:40px;height:40px;"></i></div>
      <h1 style="font-size:var(--text-2xl);margin-bottom:var(--space-3);">We'll Be Back Soon</h1>
      <p style="color:var(--ink-secondary);margin:0 auto;max-width:380px;line-height:1.6;">
        The system is undergoing scheduled maintenance to serve you better.
        Please check back shortly. We apologize for the inconvenience.
      </p>
      <div class="error-actions">
        <button class="btn btn-primary" onclick="window.location.reload()">
          <i data-lucide="refresh-cw" style="width:16px;height:16px;"></i>
          Refresh
        </button>
        <a class="btn btn-secondary" href="/login">
          <i data-lucide="log-in" style="width:16px;height:16px;"></i>
          Back to Login
        </a>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
